<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Intel Website</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

 <nav class="navbar">
  <a href="index.html" class="nav-link">Home</a>
  <a href="#newsletter" class="nav-link">Learn More</a>
</nav>

<section class="hero">
  <div class="intel-logo-wrap">
    <div class="lightning-line"></div>
    <h1 class="intel-logo">INTEL</h1>
  </div>
</section>

<section class="timeline-section">

  <div class="timeline-grid">

    <img src="img/1968 cropped ps.png" alt="1968 Intel Founded" class="timeline-card" />

    <img src="img/1971 cropped ps.png" alt="1971 First Microprocessor" class="timeline-card" />

    <img src="img/1978 cropped ps.png" alt="1978 8086 Processor" class="timeline-card" />

    <img src="img/2000s cropped ps.png" alt="2000s Efficiency Focus" class="timeline-card" />

    <img src="img/2020s cropped ps.png" alt="2020s Climate Goals" class="timeline-card" />

    <img src="img/2020plus cropped ps.png" alt="Future Cleaner Innovation" class="timeline-card" />

  </div>

</section>

<section id="newsletter" class="newsletter-section">

  <form class="newsletter-form">
    <h1>Newsletter</h1>

    <p class="newsletter-text">
      Subscribe to receive updates about Intel’s sustainability journey, technology goals,
      and future innovation.
    </p>

    <input type="text" placeholder="First Name" required />
    <input type="text" placeholder="Last Name" required />
    <input type="email" placeholder="Email" required />

    <button type="submit">Subscribe</button>
  </form>

</section>
<footer class="footer">
  <p>© 2026 Intel Sustainability Project. All rights reserved.</p>
</footer>
</body>
</html>
